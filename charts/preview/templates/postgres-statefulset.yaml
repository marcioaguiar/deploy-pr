{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "preview.postgresName" . }}
  labels:
    {{- include "preview.postgresLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "preview.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "preview.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview.postgresLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "preview.postgresSecretName" . }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "preview.postgresLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
