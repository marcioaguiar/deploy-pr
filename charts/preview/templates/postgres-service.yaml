{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview.postgresName" . }}
  labels:
    {{- include "preview.postgresLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "preview.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
{{- end }}
